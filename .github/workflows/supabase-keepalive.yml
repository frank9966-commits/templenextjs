name: Supabase Keep Alive

# 目的：免費版 Supabase 專案若一週內沒有任何資料庫活動就會被自動暫停（paused）。
# 這個 workflow 會每天自動打一次資料庫，讓專案保持活躍、不會被關掉。
#
# 注意：GitHub 會在 repo「60 天完全沒有 commit」後自動停用 schedule。
# 所以這份只當備援；正式以 Vercel Cron (/api/keepalive) 為主。
#
# 這裡用的是 anon key（公開金鑰），本來就會被打包進前端網站、任何人都看得到，
# 所以直接寫在這裡是安全的，不需要另外設定 Secrets。
# 若之後換專案，也可以在 repo Settings > Secrets 建立 SUPABASE_URL / SUPABASE_ANON_KEY 來覆寫。

on:
  schedule:
    # 每天台灣時間早上 08:00（UTC 00:00）執行一次
    - cron: "0 0 * * *"
  # 也可以到 GitHub 的 Actions 分頁手動按 Run workflow
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://slplkxtnaywuijwmdowt.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNscGxreHRuYXl3dWlqd21kb3d0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzkzMjYzNDEsImV4cCI6MjA1NDkwMjM0MX0.V6365vTG-bKWcj4u2Uo2057XnmpfDZiyEQgjbeL7AuM' }}
        run: |
          # 對 memberships 資料表送出一個很小的查詢，觸發資料庫活動
          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/memberships?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $(cat /tmp/resp.txt)"

          # 2xx 代表資料庫有回應，keep-alive 成功
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Supabase keep-alive 成功 ✅"
          else
            echo "Supabase keep-alive 失敗 ❌"
            exit 1
          fi
